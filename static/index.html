<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ddash v1.0</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/static/v1.css">
</head>
<body class="dark-mode">

<header class="dash-header">
  <div class="hdr-left">
    <span id="w-display" class="weather"><i class="fas fa-cloud-sun"></i> --° --</span>
  </div>
  <div class="hdr-center">
    <span class="brand">DDASH</span>
    <span class="conn-dot" id="conn-dot" title="Connected"></span>
    <span class="edit-badge" id="edit-badge">EDIT</span>
  </div>
  <div class="hdr-right">
    <span class="uptime" id="uptime-display">up --</span>
    <span class="clock" id="nav-clock">--:--:--</span>
  </div>
</header>

<main class="dash-main" id="dash-main">
  <!-- rows rendered by JS -->
</main>

<footer class="dash-footer">
  <div id="disk-strip" class="strip disks-strip"></div>
</footer>

<!-- menu -->
<div class="menu-fab" id="menu-fab"><div class="bar"></div></div>
<div class="menu-overlay" id="menu-overlay"></div>

<!-- Layout Workspace Modal -->
<div class="ws-overlay" id="ws-overlay">
  <div class="ws-modal">
    <div class="ws-header">
      <span class="ws-title">Layout Workspace</span>
      <div class="ws-actions">
        <button class="ws-btn ws-cancel" id="ws-cancel">Cancel</button>
        <button class="ws-btn ws-confirm" id="ws-confirm">Confirm Layout</button>
      </div>
    </div>
    <div class="ws-canvas" id="ws-canvas"></div>
  </div>
</div>

<div class="menu-panel" id="menu-panel">
  <h2>Theme</h2>
  <div class="theme-grid" id="theme-grid">
    <button class="theme-card active" data-theme=""><div class="swatch"><span style="background:#3b82f6"></span><span style="background:#22c55e"></span><span style="background:#c5cdd8"></span></div><div class="name">Default</div></button>
    <button class="theme-card" data-theme="theme-cyberpunk"><div class="swatch"><span style="background:#fcee09;box-shadow:0 0 4px #fcee09"></span><span style="background:#00f0ff;box-shadow:0 0 4px #00f0ff"></span><span style="background:#ff2060;box-shadow:0 0 4px #ff2060"></span></div><div class="name">Cyberpunk</div></button>
    <button class="theme-card" data-theme="theme-ocp"><div class="swatch"><span style="background:#ff6a00;box-shadow:0 0 4px #ff6a00"></span><span style="background:#33cc55;box-shadow:0 0 4px #33cc55"></span><span style="background:#c8d8b8"></span></div><div class="name">OCP</div></button>
    <button class="theme-card" data-theme="theme-lantern"><div class="swatch"><span style="background:#00ff88;box-shadow:0 0 6px #00ff88"></span><span style="background:#33ffaa;box-shadow:0 0 4px #33ffaa"></span><span style="background:#00ddaa"></span></div><div class="name">Lantern</div></button>
    <button class="theme-card" data-theme="theme-btop"><div class="swatch"><span style="background:#3fb950"></span><span style="background:#58a6ff"></span><span style="background:#c9d1d9"></span></div><div class="name">BTOP</div></button>
  </div>
  <h2>Edit Mode</h2>
  <div class="menu-section">
    <div class="menu-row"><span class="ml">Enable Edit</span><div class="toggle" id="edit-toggle"></div></div>
    <div class="menu-hint">Dropdowns to swap · × to remove · drag edges to resize</div>
    <div class="menu-row"><span class="ml">Layout</span>
      <div class="opt-group" id="layout-opts">
        <button class="opt-btn active" data-val="grid">Grid</button>
        <button class="opt-btn" data-val="rails">Rails</button>
      </div>
    </div>
    <button class="btn-reset" id="layout-workspace-btn">Open Layout Workspace</button>
    <button class="btn-reset" id="layout-reset">Reset Layout</button>
  </div>
  <h2>Modules</h2>
  <div class="menu-section" id="module-list"></div>
  <h2>Data</h2>
  <div class="menu-section">
    <div class="menu-row"><span class="ml">Refresh Rate</span>
      <div class="opt-group" id="refresh-opts">
        <button class="opt-btn" data-val="1">1s</button>
        <button class="opt-btn active" data-val="2">2s</button>
        <button class="opt-btn" data-val="5">5s</button>
        <button class="opt-btn" data-val="10">10s</button>
        <button class="opt-btn" data-val="30">30s</button>
      </div>
    </div>
  </div>
  <h2>Display</h2>
  <div class="menu-section">
    <div class="menu-row"><span class="ml">Temperature</span>
      <div class="opt-group" id="temp-unit-opts"><button class="opt-btn active" data-val="F">°F</button><button class="opt-btn" data-val="C">°C</button></div>
    </div>
    <div class="menu-row"><span class="ml">Clock</span>
      <div class="opt-group" id="clock-opts"><button class="opt-btn active" data-val="24">24h</button><button class="opt-btn" data-val="12">12h</button></div>
    </div>
  </div>
  <h2>Location</h2>
  <div class="menu-section">
    <div class="menu-row"><span class="ml">Weather City</span>
      <input class="menu-input" id="weather-city" type="text" placeholder="Chicago" spellcheck="false">
    </div>
  </div>
  <h2>Connection</h2>
  <div class="menu-section">
    <div class="menu-row"><span class="ml">Status</span><span class="ml" id="menu-conn" style="color:var(--green)">Connected</span></div>
    <div class="menu-row"><span class="ml">Last Update</span><span class="ml" id="menu-last" style="color:var(--text-dim)">--</span></div>
  </div>
</div>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/chartjs/chart.umd.js"></script>
<script src="/static/v1.js"></script>
</body>
</html>
