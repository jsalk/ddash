<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ddash</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/modules.css">
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/menu.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header" id="header">
      <div class="header-left">
        <span class="header-weather" id="weather"></span>
      </div>
      <div class="header-center">
        <span class="header-brand">DDASH</span>
      </div>
      <div class="header-right">
        <span class="header-uptime" id="uptime"></span>
        <span class="header-clock" id="clock"></span>
      </div>
    </header>

    <!-- Main grid — populated by layout engine -->
    <main class="dashboard" id="dashboard"></main>

    <!-- Menu FAB -->
    <button class="menu-fab" id="menu-fab" title="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Menu overlay -->
  <div class="menu-overlay" id="menu-overlay"></div>

  <!-- Settings panel -->
  <div class="menu-panel" id="menu-panel">
    <h2>Layout</h2>
    <div class="menu-section" id="layout-list"></div>
    <a href="/editor" target="_blank" class="menu-link"><i class="fas fa-pen-ruler"></i> Open Layout Editor</a>

    <h2>Modules</h2>
    <div class="menu-section">
      <div class="dual-list">
        <div class="dual-col">
          <div class="dual-header">Assigned</div>
          <div class="dual-select" id="mod-assigned"></div>
        </div>
        <div class="dual-arrows">
          <button class="arrow-btn" id="mod-add" title="Assign">&gt;</button>
          <button class="arrow-btn" id="mod-remove" title="Unassign">&lt;</button>
        </div>
        <div class="dual-col">
          <div class="dual-header">Available</div>
          <div class="dual-select" id="mod-available"></div>
        </div>
      </div>
    </div>

    <h2>Settings</h2>
    <div class="menu-section">
      <div class="menu-row"><span>Lite Edit</span><div class="toggle" id="opt-lite-edit"></div></div>
      <div class="menu-row"><span>Refresh</span><select id="opt-refresh"><option value="1">1s</option><option value="2" selected>2s</option><option value="5">5s</option><option value="10">10s</option></select></div>
      <div class="menu-row"><span>Theme</span><select id="opt-theme"><option value="default">Default</option><option value="cyberpunk">Cyberpunk</option><option value="ocp">OCP</option><option value="lantern">Lantern</option><option value="btop">BTOP</option></select></div>
      <div class="menu-row"><span>Temperature</span><select id="opt-temp"><option value="F">°F</option><option value="C">°C</option></select></div>
      <div class="menu-row"><span>Clock</span><select id="opt-clock"><option value="24">24h</option><option value="12">12h</option></select></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
